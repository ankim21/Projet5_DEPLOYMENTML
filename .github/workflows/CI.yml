# name : label in Actions side bar
name: CI

#trigger: two outcomes come from
on:
  push: #test auto a chaque commit ou push vers une branche
    branches: [main, develop]
  pull_request: # would dev still work if i merged this? validation avant fusion
    branches: [main, develop]

jobs:
  build_job:
    name: Build and install dependencies
    runs-on: ubuntu-latest #vm 
    steps:
      - name: a. Check out the code  #on log
        uses: actions/checkout@v4 #clones repo onto runner

      - name: b. Set up Python 3.11
        uses: actions/setup-python@v5  #on log
        with:
          python-version: "3.11"

      - name: c. Install dependencies #on log
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
  test_job:
    name: Test job
    needs: build_job
    runs-on: ubuntu-latest
    steps: # redo steps because each job for github action is on new VM
      - uses: actions/checkout@v4
  
      - uses: action/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # local folder on computer where pip saves downloaded installation fiels
      - name: Install dependencies
        run: pip install -r requirements.txt
  
      - name: Run tests  #on log, unit tests must not touch external systems
        run: pytest --cov=app --cov-report=term
        ## --cov=app : pytest-cov plugin and =term will print out output report
